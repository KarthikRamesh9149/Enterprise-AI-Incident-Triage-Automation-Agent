services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: incident_triage
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incident
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident -d incident_triage"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://incident:incident@postgres:5432/incident_triage
      REDIS_URL: redis://redis:6379/0
      REPORT_OUTPUT_DIR: /app/reports
      JWT_SECRET: ${JWT_SECRET:-change-this-local-development-secret}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-1200}
    ports:
      - "8000:8000"
    volumes:
      - ./reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
